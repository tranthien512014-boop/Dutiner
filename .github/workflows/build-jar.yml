name: Build Minecraft Mod JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mod with Gradle
        run: |
          unzip -q dutiner-src.zip -d temp_src
          sed -i 's/\bInput\b/ClientInput/g' temp_src/dutiner/src/main/java/dev/dutiner/mixin/InputMixin.java
          cd temp_src/dutiner
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: dutiner-mod-jar
          path: temp_src/dutiner/build/libs/*.jar
          
