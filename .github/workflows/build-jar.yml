name: Build JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Giải nén zip và biên dịch thành JAR
        run: |
          unzip -q dutiner-src.zip -d temp_src
          mkdir -p out
          find temp_src -name "*.java" > sources.txt
          javac -d out @sources.txt
          jar cf dutiner.jar -C out .

      - name: Xuất file JAR để tải về
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-jar
          path: dutiner.jar
          
